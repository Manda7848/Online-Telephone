<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <link rel="icon" type="image/x-icon" href="./logo.png">
    <!-- <script src="./game.js"></script> -->
    <script src="./play.js"></script>

    <title>Telephone Game</title>
</head>
<body>
    <div class="align">
    <img src="./PHONE.png" alt="" id="fone" class="fone">

    <div id="lobby">
    <h1>Room ID: <span id="id"></span></h1>
    
    <ul id="players">
<li>test</li>
        <li>test</li>
        <li>test</li>
        <li>test</li>
        <li>test</li>
        </ul>

    <button id="ready">I'm Ready!</button>
</div>
    </div>



<div id="roles" class="overlay">
    <h1 id="reveal-text">GET READY...</h1>
    <p id="role-assignment">Checking your roles...</p>
    <div class="loading-tip">
        <strong>Pro Tip:</strong> <span id="random-tip">LOADING.....</span>
        
    </div>
</div>

<div id="role-reveal" class="overlay">
    <!-- DYNAMICALLY CREATE THE ROLES IN THE FORMAT {NAME IS} DESCRIBER ONE, NEXT LIKE {NAME IS} DESCRIBER 2 ETC -->
</div>

<!-- Should I show my instructions in the lobby or while theyre waiting or when the game is about to start? -->

<!-- <div id="describer" class="hidden"> -->
    <!-- ADD HIDDEN ONCE DONE STYLING -->
<div id="describer">
<div id="word-round" >
    <h1 id="mustguess">Main Word</h1>
    <h2 id="forbade">You Are forbidden from saying: <span id="forbidden">AHHHHH 67</span></h2>
</div>

    <div id="hint-div">
        <input type="text" id="hint" placeholder="Type your description here...">
        <button id="send-hint">Send Hint</button>
</div>



<div id="guesser-ui" class="hidden">
    <h2 id="waiting-msg">Waiting for the describer to send a hint...</h2>
    </div>

    <div id="minigame" class="hidden">
        <h3>It's not your turn yet so you can play Tic-Tac-Toe</h3>
<div class="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>

    <button id="reset">Reset Game</button>

</div>
    </div>
</body>
</html>
